name: Self-audit

# RepoGuard audits its own repository on every PR and posts the score as a
# job summary and a sticky PR comment. This is the project's own dogfooding
# loop: the tool's health checks apply to the tool's own repo.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run RepoGuard against this repo
        run: node packages/cli/dist/index.js audit --path . --format md --out report.md

      - name: Add to job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: repoguard-self-audit
          path: report.md
