name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers on this environment
    # in Settings > Environments so publishing to npm needs manual approval.
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      # NPM_TOKEN isn't added until SETUP.md step 6 is done. Without this
      # guard, changesets/action tries to publish, npm rejects the
      # unauthenticated request, and the workflow goes red on every push
      # to main for no reason anyone did wrong.
      - name: Check for NPM_TOKEN
        id: npm-token-check
        run: echo "has-token=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Opens/updates a "Version Packages" PR when changesets are pending,
      # and publishes to npm once that PR is merged to main.
      - if: steps.npm-token-check.outputs.has-token == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.npm-token-check.outputs.has-token != 'true'
        run: echo "::notice::NPM_TOKEN not configured yet (see SETUP.md step 6) — skipping version/publish."
