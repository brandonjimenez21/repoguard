name: Feature request
description: Propose a new check, output format, or CLI behavior.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
